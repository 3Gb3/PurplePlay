<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PurplePlay - Login</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="Login/carregar.css" />
  <link rel="stylesheet" href="Login/opcao2.css" />
  <link rel="stylesheet" href="Login/fadein.css"/>
</head>
<body>
<div id="meuElemento">
  <!-- Preloader ao abrir o site -->
  <div id="preloader">
    <div class="loader"></div>
  </div>

  <!-- Preloader ao clicar em "Entrar" -->
  <div id="preloader2">
    <div class="loader-box">
      <div class="logo">🎬</div>
      <div class="text">Carregando PurplePlay...</div>
      <div class="barra">
        <div class="progresso"></div>
      </div>
    </div>
  </div>

  <div class="wrapper">
    <div class="left-panel">
      <div class="overlay">
        <h1><span>Purple</span>Play</h1>
        <p><strong>O melhor streaming para</strong><br><span>os amantes de cinema</span></p>
      </div>
    </div>

    <div class="right-panel">
      <div class="container">
        <div class="buttonsForm">
          <div class="btnColor" id="btnSlide"></div>
          <button id="btnSignin">Login</button>
          <button id="btnSignup">Cadastro</button>
        </div>

        <h2 class="title">Acesse sua conta</h2>

        <div class="forms-wrapper" id="formsWrapper">
          <form id="Entrar" class="form active" onsubmit="return verificarLogin(event)">
            <input type="text" id="loginEmail" placeholder="E-mail" required />
            <input type="password" id="loginSenha" placeholder="Senha" required />
            <button type="submit">Entrar</button>
          </form>

          <form id="Cadastrar" class="form">
            <input type="text" id="cadastroEmail" placeholder="E-mail" required />
            <input type="password" id="cadastroSenha" placeholder="Senha" required />
            <input type="password" id="cadastroConfirmarSenha" placeholder="Confirmar senha" required />
            <button type="submit">Cadastrar</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Animação de entrada -->
<script>
  window.addEventListener('load', () => {
    setTimeout(() => {
      const preloader = document.getElementById('preloader');
      preloader.style.display = 'none';
    }, 2000);
  });
</script>

<!-- Firebase SDK (versão compatível) -->
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>

<!-- Configuração centralizada do Firebase -->
<script src="firebase-config.js"></script>

<!-- Seu JavaScript principal (adaptado com Firebase) -->
<script>
  const btnSignin = document.getElementById("btnSignin");
  const btnSignup = document.getElementById("btnSignup");
  const formEntrar = document.getElementById("Entrar");
  const formCadastrar = document.getElementById("Cadastrar");
  const btnSlide = document.getElementById("btnSlide");
  const AUTH_SESSION_KEY = "purpleplay.auth.session";

  window.addEventListener('load', () => {
    document.body.classList.add('loading');
    setTimeout(() => {
      document.getElementById('preloader').style.display = 'none';
      document.body.classList.remove('loading');
      const elemento = document.getElementById('meuElemento');
      if (elemento) elemento.classList.add('fade-in');
    }, 2000);
  });

  btnSignin.addEventListener("click", () => {
    formEntrar.classList.add("active");
    formCadastrar.classList.remove("active");
    btnSlide.style.left = "0";
  });

  btnSignup.addEventListener("click", () => {
    formEntrar.classList.remove("active");
    formCadastrar.classList.add("active");
    btnSlide.style.left = "50%";
  });

  formCadastrar.addEventListener("submit", async function (e) {
    e.preventDefault();
    const email = document.getElementById("cadastroEmail").value.trim().toLowerCase();
    const senha = document.getElementById("cadastroSenha").value;
    const confirmar = document.getElementById("cadastroConfirmarSenha").value;

    if (senha !== confirmar) {
      alert("As senhas não coincidem.");
      return;
    }

    try {
      const projeto = (firebase.app().options && firebase.app().options.projectId) || "desconhecido";
      const credencial = await firebase.auth().createUserWithEmailAndPassword(email, senha);
      await credencial.user.reload();
      await firebase.auth().signOut();
      sessionStorage.removeItem(AUTH_SESSION_KEY);

      const emailCriado = (credencial.user && credencial.user.email) || email;
      alert(`Cadastro realizado com sucesso para ${emailCriado} no projeto ${projeto}.`);
      formEntrar.classList.add("active");
      formCadastrar.classList.remove("active");
      btnSlide.style.left = "0";
    } catch (error) {
      const codigo = error && error.code ? error.code : "";

      if (codigo === "auth/email-already-in-use") {
        alert("Este e-mail já está cadastrado.");
      } else if (codigo === "auth/invalid-email") {
        alert("E-mail inválido.");
      } else if (codigo === "auth/weak-password") {
        alert("Senha fraca. Use pelo menos 6 caracteres.");
      } else if (codigo === "auth/operation-not-allowed") {
        alert("Cadastro desativado no Firebase. Ative Email/Senha em Authentication > Sign-in method.");
      } else if (codigo === "auth/network-request-failed") {
        alert("Falha de rede. Verifique sua conexão e tente novamente.");
      } else {
        alert("Erro no cadastro: " + (error.message || "erro desconhecido."));
      }
    }
  });

  async function verificarLogin(event) {
    event.preventDefault();
    const email = document.getElementById("loginEmail").value.trim();
    const senha = document.getElementById("loginSenha").value;

    try {
      await firebase.auth().setPersistence(firebase.auth.Auth.Persistence.SESSION);
      const credencial = await firebase.auth().signInWithEmailAndPassword(email, senha);
      // Garante que a conta ainda existe e a sessão está válida.
      await credencial.user.reload();
      sessionStorage.setItem(AUTH_SESSION_KEY, "1");

      document.getElementById('preloader2').style.display = 'flex';
      setTimeout(() => {
        window.location.href = "principal_v2.html";
      }, 2200);
    } catch (error) {
      sessionStorage.removeItem(AUTH_SESSION_KEY);
      const codigo = error && error.code ? error.code : "";

      if (codigo === "auth/user-not-found") {
        alert("Esse e-mail não possui cadastro.");
      } else if (
        codigo === "auth/wrong-password" ||
        codigo === "auth/invalid-credential" ||
        codigo === "auth/invalid-login-credentials"
      ) {
        alert("Email ou senha inválidos.");
      } else if (codigo === "auth/too-many-requests") {
        alert("Muitas tentativas. Tente novamente mais tarde.");
      } else {
        alert("Não foi possível entrar: " + (error.message || "erro desconhecido."));
      }
    }

    return false;
  }
</script>
</body>
</html>
